name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Regenerar Info.plist Limpio con Permisos de Apple
        run: |
          cat << 'EOF' > CrownBuilders/Platforms/iOS/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>CFBundleIconName</key>
              <string>crownbuilders</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>XSAppIconAssets</key>
              <string>Assets.xcassets/crownbuilders.appiconset</string>

              <!-- Permisos requeridos para evitar el crash al tomar/seleccionar foto -->
              <key>NSCameraUsageDescription</key>
              <string>Crown Builders requiere acceso a la cámara para tomar fotos de perfil y adjuntar avances de obra.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Crown Builders requiere acceso a la galería para seleccionar la foto de perfil.</string>
          </dict>
          </plist>
          EOF

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          # 1. Crear directorio de perfiles en macOS
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # 2. Decodificar e instalar el perfil de aprovisionamiento
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/CrownBuilders_App_Store.mobileprovision

          # 3. Decodificar el certificado p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          # 4. Crear un llavero temporal en el runner para la firma
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          # 5. Importar el certificado p12 al llavero
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A -t agg
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Restore Dependencies
        run: |
          dotnet restore CrownBuilders/CrownBuilders.csproj \
            /p:TargetFramework=net10.0-ios \
            /p:EnableWindowsTargeting=true

      - name: Build and Publish iOS App (Release)
        run: |
          dotnet publish CrownBuilders/CrownBuilders.csproj \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            /p:EnableWindowsTargeting=true \
            /p:EnableCodeSigning=true \
            /p:CodesignKey="Apple Distribution" \
            /p:CodesignProvisioningProfile="CrownBuilders_App_Store"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: CrownBuilders/bin/Release/net10.0-ios/ios-arm64/publish/
