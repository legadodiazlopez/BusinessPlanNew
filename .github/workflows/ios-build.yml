name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main", "fix/iphone-version3" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Workloads
      run: dotnet workload install maui-ios

    - name: Install Apple Certificate
      uses: apple-actions/import-codesign-certs@v3
      with:
        p12-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.P12_PASSWORD }}

    - name: Install Provisioning Profile
      uses: apple-actions/download-provisioning-profile@v1
      with:
        bundle-id: '*'
        profile-base64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}

    - name: Build MAUI iOS App
      run: |
        dotnet publish CrownBuilders/CrownBuilders.csproj -f net10.0-ios -c Release -p:ArchiveOnBuild=true
