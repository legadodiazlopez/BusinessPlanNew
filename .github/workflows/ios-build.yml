name: Build and Upload iOS App to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload-ios:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Configurar Llavero y Certificado Nativamente
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # Crear un llavero temporal dedicado para la compilación
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temporary_password"
          
          echo "Creando llavero de compilación..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Decodificar el certificado P12
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          
          # Importar el certificado al llavero creado con permisos de firma
          echo "Importando certificado P12..."
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          
          # Configurar la búsqueda de llaveros en el runner
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN_PATH"
          
          # Verificar que la identidad de firma sea visible para el sistema
          security find-identity -v -p codesigning

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > "$PP_PATH"
          
          # Extraer el UUID real del perfil
          UUID=$(grep -a -A 1 '<key>UUID</key>' "$PP_PATH" | tail -n 1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          echo "UUID del perfil: $UUID"
          
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROVISIONING_UUID=$UUID" >> $GITHUB_ENV

      - name: Corregir e Imprimir Info.plist
        run: |
          python3 -c "
          import os

          content = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>CFBundleIconName</key>
              <string>crownbuilders</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>XSAppIconAssets</key>
              <string>Assets.xcassets/crownbuilders.appiconset</string>

              <!-- Permisos requeridos para evitar el crash al tomar/seleccionar foto -->
              <key>NSCameraUsageDescription</key>
              <string>Crown Builders requiere acceso a la cámara para tomar fotos de perfil y adjuntar avances de obra.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Crown Builders requiere acceso a la galería para seleccionar la foto de perfil.</string>
          </dict>
          </plist>'''

          filepath = 'CrownBuilders/Platforms/iOS/Info.plist'
          os.makedirs(os.path.dirname(filepath), exist_ok=True)
          with open(filepath, 'w', encoding='utf-8') as f:
              f.write(content.strip())

          print('--- INFO.PLIST GENERADO EXITOSAMENTE ---')
          "

      - name: Restore Dependencies
        run: |
          dotnet restore CrownBuilders/CrownBuilders.csproj \
            /p:TargetFramework=net10.0-ios \
            /p:EnableWindowsTargeting=true

      - name: Publish iOS App (Release)
        run: |
          dotnet publish CrownBuilders/CrownBuilders.csproj \
            -c Release \
            -f net10.0-ios \
            /p:EnableWindowsTargeting=true \
            /p:ArchiveOnBuild=true \
            /p:CodesignKey="Apple Distribution" \
            /p:CodesignProvision="${{ env.PROVISIONING_UUID }}"

      - name: Localizar y Copiar IPA a Output
        run: |
          mkdir -p output
          IPA_ORIGIN=$(find . -name "*.ipa" | head -n 1)
          if [ -n "$IPA_ORIGIN" ]; then
            cp "$IPA_ORIGIN" output/CrownBuilders.ipa
            echo "IPA copiado exitosamente a output/CrownBuilders.ipa"
          else
            echo "Error: No se encontró ningún archivo .ipa tras el publish"
            exit 1
          fi
          ls -la output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: output/*.ipa

      - name: Upload App to TestFlight / App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'output/CrownBuilders.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
