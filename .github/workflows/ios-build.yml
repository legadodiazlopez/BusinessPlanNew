name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Interceptar Version de Xcode
        run: |
          mkdir -p /tmp/xcode_wrapper
          cat << 'EOF' > /tmp/xcode_wrapper/xcodebuild
          #!/bin/bash
          if [[ "$*" == *"-version"* ]]; then
            echo "Xcode 27.0"
            echo "Build version 27A522"
          else
            REAL_BIN="/usr/bin/xcodebuild"
            if [ -f "$REAL_BIN" ]; then
              exec "$REAL_BIN" "$@"
            else
              exec /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild "$@"
            fi
          fi
          EOF
          chmod +x /tmp/xcode_wrapper/xcodebuild
          echo "/tmp/xcode_wrapper" >> $GITHUB_PATH

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Restore Dependencies
        run: |
          dotnet restore CrownBuilders/CrownBuilders.csproj \
            /p:TargetFramework=net10.0-ios \
            /p:EnableWindowsTargeting=true

      - name: Desactivar Validacion de Xcode en el SDK
        run: |
          chmod -R 777 ~/.dotnet/packs || true
          python3 -c "
          import os

          packs_dir = os.path.expanduser('~/.dotnet/packs')
          for root, dirs, files in os.walk(packs_dir, followlinks=True):
              for file in files:
                  if file.endswith(('.targets', '.props')):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'rb') as f:
                              data = f.read()

                          u8_err, u8_warn = b'<Error', b'<Warning'
                          u8_err_close, u8_warn_close = b'</Error>', b'</Warning>'
                          u16_err, u16_warn = '<Error'.encode('utf-16-le'), '<Warning'.encode('utf-16-le')
                          u16_err_close, u16_warn_close = '</Error>'.encode('utf-16-le'), '</Warning>'.encode('utf-16-le')

                          modified = False
                          if u8_err in data:
                              data = data.replace(u8_err, u8_warn).replace(u8_err_close, u8_warn_close)
                              modified = True
                          if u16_err in data:
                              data = data.replace(u16_err, u16_warn).replace(u16_err_close, u16_warn_close)
                              modified = True

                          if modified:
                              os.chmod(filepath, 0o777)
                              with open(filepath, 'wb') as f:
                                  f.write(data)
                              print(f'PARCHEADO: {os.path.basename(filepath)}')
                      except Exception as e:
                          print(f'Error en {filepath}: {e}')
          "

      - name: Build iOS App (Release)
        run: |
          dotnet build CrownBuilders/CrownBuilders.csproj \
            --no-restore \
            -c Release \
            -f net10.0-ios \
            /p:EnableWindowsTargeting=true \
            /p:ArchiveOnBuild=true \
            /p:EnableAssemblyILStripping=false

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: CrownBuilders/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa
