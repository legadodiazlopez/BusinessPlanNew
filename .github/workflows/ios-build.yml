name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Restore Dependencies
        run: |
          dotnet restore CrownBuilders/CrownBuilders.csproj \
            /p:TargetFramework=net10.0-ios \
            /p:EnableWindowsTargeting=true

      - name: Desactivar Validacion de Xcode en el SDK
        run: |
          echo "Habilitando permisos de escritura en paquetes .NET..."
          chmod -R 777 ~/.dotnet/packs

          python3 -c "
          import os, stat

          packs_dir = os.path.expanduser('~/.dotnet/packs')
          patched_files = 0

          for root, dirs, files in os.walk(packs_dir):
              for file in files:
                  if file.endswith(('.targets', '.props')):
                      filepath = os.path.join(root, file)
                      try:
                          os.chmod(filepath, 0o777)
                          with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()

                          if '<Error' in content and 'Xcode' in content:
                              new_content = content.replace('<Error', '<Warning').replace('</Error>', '</Warning>')
                              with open(filepath, 'w', encoding='utf-8') as f:
                                  f.write(new_content)
                              print(f'¡Modificado exitosamente!: {file}')
                              patched_files += 1
                      except Exception as e:
                          print(f'Error en {file}: {e}')

          print(f'Total de archivos modificados: {patched_files}')
          "

      - name: Build iOS App (Release)
        run: |
          dotnet build CrownBuilders/CrownBuilders.csproj \
            --no-restore \
            -c Release \
            -f net10.0-ios \
            /p:EnableWindowsTargeting=true \
            /p:ArchiveOnBuild=true \
            /p:EnableAssemblyILStripping=false

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: CrownBuilders/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa
