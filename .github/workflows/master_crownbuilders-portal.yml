# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy .NET Core app to Azure Web App - crownbuilders-portal

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Publish with dotnet
      run: dotnet publish CrownBuilders/CrownBuilders.csproj -c Release -f net9.0-windows10.0.19041.0 -o "${{github.workspace}}/myapp"

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CC363CD721BE4F43B376C4DAA362F73 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EDB83924834A451DB73C3207875E6760 }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EDC3610621AE43AA94E2FEE1F51FB5B0 }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'crownbuilders-portal'
        slot-name: 'production'
        package: '${{github.workspace}}/myapp'
