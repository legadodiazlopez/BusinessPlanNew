name: Build and deploy .NET Core app to Azure Web App - crownbuilders-portal

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'

    - name: Build with dotnet
      run: dotnet build CrownBuilders/CrownBuilders.csproj --configuration Release

    - name: Publish with dotnet
      run: dotnet publish CrownBuilders/CrownBuilders.csproj --configuration Release -f net9.0-windows10.0.19041.0 -o "${{github.workspace}}/myapp"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'crownbuilders-portal'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '${{github.workspace}}/myapp'
