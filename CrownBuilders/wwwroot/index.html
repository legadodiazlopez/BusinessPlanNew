<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CrownBuilders</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="CrownBuilders.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        // Si el emulador tarda en responder, este script despierta la interfaz de Blazor
        window.setTimeout(function () {
            var loadingEl = document.getElementById('app');
            if (loadingEl && loadingEl.innerHTML.includes('Loading')) {
                console.log("Forzando refresco de renderizado en emulador...");
                Blazor.start();
            }
        }, 1000);
    </script>
</body>

</html>
